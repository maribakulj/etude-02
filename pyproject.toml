[project]
name = "etude02"
version = "0.0.1"
description = "What cannot be drawn: text, image and encoding in Alciato's emblems"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jupyter>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etude02"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
